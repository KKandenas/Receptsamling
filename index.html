<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Receptlådan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F2A22">
<meta name="apple-mobile-web-app-title" content="Receptlådan">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1F2A22;
    --bg-2: #263229;
    --card: #FBF6E9;
    --card-edge: #EDE4CC;
    --ink: #2A2620;
    --ink-soft: #6B6455;
    --mustard: #D9A441;
    --mustard-deep: #B98526;
    --brick: #A8432B;
    --pin: #8C8272;
    --ring: rgba(217,164,65,0.55);

    --fg: #FBF6E9;
    --fg-soft: #C9C2AE;
    --panel-bg: #26332A;
    --panel-border: #3A4438;
    --panel-text: #F3EFE2;
    --panel-placeholder: #8E8B78;
    --line: #454F41;
    --ghost-text: #E7E1CE;
    --ghost-hover: #2B372D;
    --label-muted: #CFC9B6;
    --whoami-text: #B7B199;
    --muted: #A7A188;
    --err: #E7A891;
  }
  :root[data-theme="light"]{
    --bg: #F3ECDC;
    --bg-2: #EAE0C8;
    --fg: #2A2620;
    --fg-soft: #6B6455;
    --panel-bg: #FFFDF6;
    --panel-border: #DED2AC;
    --panel-text: #2A2620;
    --panel-placeholder: #9C947C;
    --line: #DAC98A;
    --ghost-text: #5E4E22;
    --ghost-hover: #EFE7CE;
    --label-muted: #6B5A2E;
    --whoami-text: #6B6455;
    --muted: #8C8262;
    --err: #A8432B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--bg-2), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: 'Karla', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition: background-color .15s ease, color .15s ease;
  }
  ::selection{ background: var(--mustard); color:#1F2A22; }

  .wrap{ max-width: 980px; margin:0 auto; padding: 28px 18px 80px; }

  header.top{ display:flex; flex-direction:column; gap:4px; margin-bottom:22px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color: var(--mustard); opacity:.9;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-optical-sizing:auto;
    font-size: clamp(32px, 6vw, 52px); margin:2px 0 4px; color:var(--fg);
    letter-spacing:-0.01em;
  }
  .sub{ color:var(--fg-soft); font-size:14.5px; max-width:52ch; line-height:1.5;}

  .icon-cluster{ position:fixed; top:16px; right:16px; z-index:60; display:flex; gap:10px; }
  .theme-toggle{
    width:38px; height:38px; border-radius:50%;
    background:var(--panel-bg); border:1px solid var(--panel-border); color:var(--panel-text);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle:hover{ filter:brightness(1.1); }

  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin: 22px 0 18px;
  }
  .search{
    flex:1 1 220px; min-width:160px;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:10px;
    padding:11px 14px; color:var(--panel-text); font-size:14.5px; font-family:'Karla',sans-serif;
  }
  .search::placeholder{ color:var(--panel-placeholder); }
  .search:focus{ outline:2px solid var(--ring); outline-offset:1px; border-color:transparent;}

  .btn{
    font-family:'Karla',sans-serif; font-weight:700; font-size:14px;
    border:none; border-radius:9px; padding:11px 18px; cursor:pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn-primary{ background: var(--mustard); color:#251C0B; }
  .btn-primary:hover{ filter:brightness(1.07); }
  .btn-ghost{ background:transparent; color:var(--ghost-text); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--ghost-hover); }
  .btn-secondary{ background:#EFE7CE; color:#5E4E22; border:1px solid #DAC98A; }
  .btn-secondary:hover{ background:#E6DCB8; }
  .btn-danger{ background:transparent; color:#E7A891; border:1px solid #5A342A; }
  .btn-danger:hover{ background:#3A241E; }

  .tagbar{ display:flex; flex-wrap:wrap; gap:8px; max-width:280px; }

  .dropdown-wrap{ position:relative; display:inline-block; }
  .dropdown-panel{
    position:absolute; top:calc(100% + 6px); left:0; z-index:40;
    background:var(--card); color:var(--ink); border:1px solid var(--card-edge); border-radius:8px;
    box-shadow:0 14px 30px rgba(0,0,0,.28); padding:8px; min-width:210px;
    display:none;
  }
  .dropdown-panel.open{ display:block; }
  .dropdown-panel.align-right{ left:auto; right:0; }
  .dropdown-item{
    display:block; width:100%; text-align:left; background:none; border:none; border-radius:6px;
    padding:9px 10px; font-family:'Karla',sans-serif; font-size:14px; color:var(--ink); cursor:pointer;
  }
  .dropdown-item:hover{ background:#F6F0DD; }

  .tagfilter-row{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:26px; }
  .tagfilter-count{
    display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px;
    margin-left:6px; border-radius:50%; background:var(--mustard); color:#251C0B;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:0 4px;
  }
  .active-tag-pills{ display:flex; flex-wrap:wrap; gap:7px; }
  .active-tag-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    padding:5px 6px 5px 11px; border-radius:20px; background:var(--mustard); color:#251C0B; border:none; cursor:pointer;
  }
  .chip{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.03em;
    padding:6px 11px; border-radius:20px; border:1px solid var(--line); color:var(--label-muted);
    background:transparent; cursor:pointer; text-transform:uppercase;
  }
  .chip.active{ background:var(--mustard); border-color:var(--mustard); color:#251C0B; }
  #planTagFilterRow .chip.active{ text-decoration:line-through; }
  .chip:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap: 22px;
  }
  .empty, .err-box{
    grid-column: 1/-1; text-align:center; padding: 60px 20px; color:var(--muted);
    font-family:'Fraunces',serif; font-size:19px;
  }
  .empty span, .err-box span{ display:block; font-family:'Karla',sans-serif; font-size:13.5px; margin-top:8px; color:var(--panel-placeholder);}
  .err-box{ color:var(--err); }

  .card{
    position:relative; background:var(--card); color:var(--ink);
    border-radius:3px; padding:18px 17px 16px; cursor:pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,.28), 0 2px 0 var(--card-edge);
    transform: rotate(var(--r,0deg));
    transition: transform .15s ease, box-shadow .15s ease;
    border:1px solid var(--card-edge);
  }
  .card:nth-child(3n){ --r:-0.6deg; }
  .card:nth-child(3n+1){ --r:0.5deg; }
  .card:nth-child(3n+2){ --r:-0.2deg; }
  .card:hover{ transform: rotate(0deg) translateY(-3px); box-shadow: 0 16px 30px rgba(0,0,0,.34); }
  .card:focus-visible{ outline:2px solid var(--mustard-deep); outline-offset:3px; }
  .pin{
    position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    width:12px; height:12px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d8cfb4, var(--pin));
    box-shadow: 0 2px 3px rgba(0,0,0,.35);
  }
  .fav-btn{
    position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,253,246,0.85); border:1px solid var(--card-edge); color:#C9BFA0;
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: color .12s ease, transform .12s ease;
  }
  .fav-btn:hover{ transform:scale(1.08); }
  .fav-btn.active{ color: var(--brick); }
  .plan-card-day{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    color: var(--mustard-deep); font-weight:700; margin:26px 0 6px;
  }
  .plan-card-remove{
    position:absolute; top:10px; left:10px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,253,246,0.85); border:1px solid var(--card-edge); color:var(--brick);
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease;
  }
  .plan-card-remove:hover{ transform:scale(1.08); }
  .plan-card-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    min-height:180px; border:1.5px dashed var(--card-edge); background:transparent; box-shadow:none; cursor:default;
  }
  .plan-card-empty:hover{ transform:none; box-shadow:none; }
  .card-thumb{
    width:100%; height:120px; object-fit:cover; border-radius:2px; margin-bottom:10px;
    filter: saturate(0.98);
  }
  .card-name{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px; line-height:1.15;
    margin:0 0 8px;
  }
  .card-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tag-pill{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.03em;
    text-transform:uppercase; padding:3px 8px; border-radius:20px;
    background:#EFE7CE; color:#6B5A2E; border:1px solid #E0D3A8;
  }
  .card-snippet{ font-size:13px; color:var(--ink-soft); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-source{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8C8262; margin-top:10px; }

  .stars-row{ display:flex; align-items:center; gap:6px; }
  .stars-glyphs{ color:var(--mustard-deep); letter-spacing:2px; font-size:14px; }
  .stars-count{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8C8262; }
  .stars-empty .stars-glyphs{ color:#D8CDA8; }
  .card-stars{ margin-bottom:8px; }
  .stars-interactive{ gap:2px; }
  .star-btn{
    background:none; border:none; font-size:24px; line-height:1; padding:2px; cursor:pointer;
    color:#D8CDA8; transition: color .1s ease, transform .1s ease;
  }
  .star-btn:hover{ transform: scale(1.15); }
  .star-btn.filled{ color: var(--mustard-deep); }
  .star-btn:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; border-radius:4px; }
  .detail-rating{ margin: 4px 0 16px; }
  .detail-rating-label{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.08em; color:#8C8262; margin-bottom:6px;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(15,18,14,.72); backdrop-filter: blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding: 26px 14px;
    overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--card); color:var(--ink); width:100%; max-width:560px;
    border-radius:6px; padding:26px 24px 24px; margin-top:20px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .modal h2{ font-family:'Fraunces',serif; font-size:26px; margin:0 0 4px; font-weight:600;}
  .modal-close{
    float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);
    line-height:1; padding:4px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.08em; color:#8C8262; margin-bottom:6px;
  }
  .field input[type=text], .field input[type=url], .field textarea{
    width:100%; border:1px solid #DED2AC; border-radius:7px; padding:10px 12px;
    font-family:'Karla',sans-serif; font-size:14.5px; background:#FFFDF6; color:var(--ink);
  }
  .field textarea{ min-height:110px; resize:vertical; font-family:'Karla',sans-serif; line-height:1.5;}
  .field input:focus, .field textarea:focus{ outline:2px solid var(--mustard-deep); outline-offset:1px; }
  .chiprow{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip-select{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
    padding:6px 10px; border-radius:20px; border:1px solid #DAC98A; background:#FFFDF6;
    color:#6B5A2E; cursor:pointer;
  }
  .chip-select.active{ background:var(--mustard); border-color:var(--mustard); color:#251C0B; }
  .customtag{ display:flex; gap:8px; margin-top:9px; }
  .customtag input{ flex:1; }
  .imgpick{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .imgpick img{ width:74px; height:74px; object-fit:cover; border-radius:6px; border:1px solid #DED2AC;}
  .thumb-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .thumb-item{ position:relative; }
  .thumb-item img{ width:74px; height:74px; object-fit:cover; border-radius:6px; border:1px solid #DED2AC; display:block; }
  .thumb-remove{
    position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:50%;
    background:var(--brick); color:#FBF6E9; border:none; font-size:13px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .filelabel{
    font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px;
    background:#F1E9D2; color:#5E4E22; cursor:pointer; border:1px solid #DAC98A;
  }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px; flex-wrap:wrap;}
  .modal-actions .right{ display:flex; gap:10px; }

  .detail-tags{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
  .detail-gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-bottom:14px; }
  .detail-gallery img{ width:100%; height:120px; object-fit:cover; border-radius:6px; cursor:pointer; }
  .detail-img{ width:100%; max-height:280px; object-fit:cover; border-radius:6px; margin-bottom:14px; }
  .detail-link{ color:var(--mustard-deep); font-weight:700; text-decoration:none; word-break:break-all; }
  .detail-link:hover{ text-decoration:underline; }
  .detail-text{ white-space:pre-wrap; line-height:1.6; font-size:14.5px; color:#3A362C; margin-top:6px; }
  .detail-ingredients{ margin:6px 0 0; padding-left:20px; font-size:14.5px; line-height:1.6; color:#3A362C; }
  .detail-ingredients li{ margin-bottom:2px; }
  .detail-date{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#9C947C; margin-top:18px; }

  .loading{ grid-column: 1/-1; text-align:center; padding:60px 10px; color:var(--whoami-text); font-family:'Karla',sans-serif; }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(10,12,9,.94); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  .lightbox-imgwrap{
    flex:1; width:100%; overflow:auto; display:flex; align-items:center; justify-content:center;
    touch-action: pinch-zoom pan-x pan-y;
  }
  .lightbox-imgwrap img{
    max-width:none; transition: width .15s ease; cursor: zoom-in; touch-action: pinch-zoom pan-x pan-y;
  }
  .lightbox-controls{
    display:flex; gap:10px; padding:14px; align-items:center;
  }
  .lightbox-controls button{
    background:#2A2620; color:#FBF6E9; border:1px solid #454F41; border-radius:8px;
    width:40px; height:40px; font-size:18px; cursor:pointer;
  }
  .lightbox-close{
    position:absolute; top:14px; right:16px; background:none; border:none;
    color:#FBF6E9; font-size:26px; cursor:pointer; padding:6px;
  }
  .lightbox-hint{ color:var(--muted); font-size:12px; font-family:'Karla',sans-serif; padding-bottom:4px; }

  /* Tag manager */
  .tagrow{
    display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #EDE4CC;
  }
  .tagrow input[type=text]{
    flex:1; border:1px solid #DED2AC; border-radius:6px; padding:7px 10px;
    font-family:'Karla',sans-serif; font-size:14px; background:#FFFDF6; color:var(--ink);
  }
  .tagrow-actions{ display:flex; gap:6px; }
  .tagrow-actions button{
    font-size:12.5px; font-weight:700; border-radius:6px; border:none; padding:7px 10px; cursor:pointer;
  }
  .tagrow-save{ background:var(--mustard); color:#251C0B; }
  .tagrow-del{ background:transparent; color:var(--brick); border:1px solid #DFC7BE !important; }
  .addtagrow{ display:flex; gap:8px; margin-top:14px; }
  .addtagrow input{ flex:1; }

  .explore-intro{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 16px; }
  .explore-searchrow{ display:flex; gap:8px; margin-bottom:20px; }
  .explore-searchrow input{ flex:1; }
  .sitegroup-title{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:#9C947C; margin:18px 0 8px;
  }
  .sitegroup-title:first-of-type{ margin-top:0; }
  .siterow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid #EDE4CC;
  }
  .sitemeta{ min-width:0; }
  .sitename{ font-weight:700; color:var(--ink); text-decoration:none; }
  .sitename:hover{ text-decoration:underline; }
  .sitedesc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .sitesearch-btn{ flex:0 0 auto; white-space:nowrap; }

  .planbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:26px; }
  .plan-range{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .plan-day{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #EDE4CC; }
  .picker-item{
    display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
    background:none; border:none; border-bottom:1px solid #EDE4CC; padding:9px 4px; cursor:pointer;
    font-family:'Karla',sans-serif; font-size:14px; color:var(--ink);
  }
  .picker-item:hover{ background:#F6F0DD; }
  .picker-item-owner{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:#9C947C; text-transform:uppercase; }

  @media (prefers-reduced-motion: reduce){
    .card, .btn{ transition:none; }
  }

  /* User chooser */
  .chooser{
    position:fixed; inset:0; background:var(--bg); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .chooser-card{ max-width:420px; width:100%; }
  .user-list{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .user-btn{
    text-align:left; background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:10px;
    padding:14px 16px; color:var(--panel-text); font-family:'Fraunces',serif; font-size:17px; cursor:pointer;
  }
  .user-btn:hover{ background:var(--ghost-hover); }
  .whoami{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--whoami-text); margin-top:2px;
  }
  .whoami button{
    background:none; border:none; color:var(--mustard); text-decoration:underline; cursor:pointer;
    font-family:'Karla',sans-serif; font-size:13px; padding:0;
  }
  .whoami input[type=text]{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:6px; color:var(--panel-text);
    font-family:'Karla',sans-serif; font-size:13px; padding:5px 9px; width:160px;
  }
  .card-owner{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    color:#9C947C; margin-top:4px;
  }
  .detail-owner{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    color:#9C947C; margin-bottom:6px;
  }
</style>
</head>
<body>
<div class="chooser" id="chooserScreen" style="display:none;">

async function loadTags(){
  const { data, error } = await sb.from('tags').select('*').order('name', { ascending:true });
  if(error){
    // Table not created yet (e.g. migration not run) - fall back to defaults + whatever recipes use.
    const s = new Set(DEFAULT_TAGS);
    recipes.forEach(r => (r.tags||[]).forEach(t => s.add(t)));
    allTags = Array.from(s).map(name => ({ id:null, name }));
    return;
  }
  allTags = data || [];
  // Auto-heal: any tag used on a recipe but missing from the tags table gets added, so it shows up in the manager.
  const known = new Set(allTags.map(t => t.name));
  const missing = new Set();
  recipes.forEach(r => (r.tags||[]).forEach(t => { if(!known.has(t)) missing.add(t); }));
  if(missing.size){
    const rows = Array.from(missing).map(name => ({ name }));
    const { data: inserted, error: insErr } = await sb.from('tags').insert(rows).select();
    if(!insErr && inserted) allTags = allTags.concat(inserted).sort((a,b) => a.name.localeCompare(b.name,'sv'));
  }
}

function ratingStatsFor(recipeId){
  const rs = ratings.filter(x => x.recipe_id === recipeId);
  if(!rs.length) return { avg: 0, count: 0 };
  const avg = rs.reduce((s,x) => s + x.rating, 0) / rs.length;
  return { avg, count: rs.length };
}

function starsMarkupReadonly(avg, count){
  const rounded = Math.round(avg);
  let glyphs = '';
  for(let i=1;i<=5;i++) glyphs += i<=rounded ? '★' : '☆';
  return `<div class="stars-row${count ? '' : ' stars-empty'}"><span class="stars-glyphs">${glyphs}</span>${count ? `<span class="stars-count">${avg.toFixed(1)} (${count})</span>` : ''}</div>`;
}

let mealPlan = []; // [{id, user_id, plan_date, recipe_id}] for currentUser
let planWeekStart = mondayOf(new Date());
let planExcludedTags = loadPlanExcludedTags();

function loadPlanExcludedTags(){
  try{
    const raw = localStorage.getItem('receptladan_plan_excluded_tags');
    return new Set(raw ? JSON.parse(raw) : []);
  }catch(e){ return new Set(); }
}
function savePlanExcludedTags(){
  try{ localStorage.setItem('receptladan_plan_excluded_tags', JSON.stringify(Array.from(planExcludedTags))); }catch(e){ /* ignore */ }
}
function isEligibleForPlan(recipe){
  if(!planExcludedTags.size) return true;
  return !(recipe.tags || []).some(t => planExcludedTags.has(t));
}

function mondayOf(date){
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay(); // 0=sön..6=lör
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d;
}
function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function isoDate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Opportunistic variation for "Slumpa förslag": if a recipe happens to carry one of
// these tags we use it to avoid repeating the same protein within a week. Recipes
// without any of these tags just land in a shared "_other" bucket — no forced taxonomy.
const VARIETY_TAG_CANDIDATES = ['fisk','skaldjur','kött','kyckling','fågel','vegetariskt','vegansk','fläsk','lamm','nöt','korv'];
function varietyGroupFor(recipe){
  const tags = (recipe.tags || []).map(t => t.toLowerCase());
  return VARIETY_TAG_CANDIDATES.find(cand => tags.includes(cand)) || '_other';
}

async function randomizeWeek(){
  const weekDates = Array.from({ length: 7 }, (_, i) => isoDate(addDays(planWeekStart, i)));
  const emptyDates = weekDates.filter(d => !mealPlan.some(p => p.plan_date === d));
  const planError = document.getElementById('planError');
  if(!emptyDates.length) return;

  const usedGroupsThisWeek = new Set();
  const usedRecipeIds = new Set(mealPlan.map(p => p.recipe_id));
  weekDates.forEach(d => {
    const entry = mealPlan.find(p => p.plan_date === d);
    const r = entry && recipes.find(x => x.id === entry.recipe_id);
    if(r) usedGroupsThisWeek.add(varietyGroupFor(r));
  });

  const pool = shuffleArray(recipes.filter(r => !usedRecipeIds.has(r.id) && isEligibleForPlan(r)));
  const byGroup = {};
  pool.forEach(r => { const g = varietyGroupFor(r); (byGroup[g] = byGroup[g] || []).push(r); });

  const newRows = [];
  for(const dateStr of emptyDates){
    const availableGroups = Object.keys(byGroup).filter(g => byGroup[g].length && !usedGroupsThisWeek.has(g));
    const chosenGroup = availableGroups[0] || Object.keys(byGroup).find(g => byGroup[g].length);
    if(!chosenGroup) break;
    const recipe = byGroup[chosenGroup].shift();
    usedGroupsThisWeek.add(chosenGroup);
    newRows.push({ user_id: currentUser.id, plan_date: dateStr, recipe_id: recipe.id });
  }

  if(!newRows.length){
    if(planError){ planError.textContent = 'Inga fler recept att föreslå.'; planError.style.display = ''; }
    return;
  }
  const { error } = await sb.from('meal_plan').insert(newRows);
  if(error){
    if(planError){ planError.textContent = 'Kunde inte spara förslag: ' + error.message; planError.style.display = ''; }
    return;
  }
  if(newRows.length < emptyDates.length && planError){
    planError.textContent = 'Slut på recept att föreslå — fyllde i vad jag kunde.';
    planError.style.display = '';
  }
  await loadMealPlan();
  renderGrid();
}

function openRecipePicker(onSelect){
  const box = document.createElement('div');
  box.className = 'overlay';
  box.style.zIndex = '150';
  box.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <button class="modal-close" id="closePicker" aria-label="Stäng">✕</button>
      <h2 style="font-size:20px;">Välj recept</h2>
      <input type="text" class="search" id="pickerSearch" placeholder="Sök recept…" style="width:100%; margin-bottom:12px; color:var(--ink); background:#FFFDF6; border:1px solid #DED2AC;">
      <div id="pickerList" style="max-height:320px; overflow-y:auto;"></div>
    </div>
  `;
  document.body.appendChild(box);
  const searchInput = box.querySelector('#pickerSearch');
  const list = box.querySelector('#pickerList');
  function renderList(){
    const term = searchInput.value.trim().toLowerCase();
    const matches = recipes.filter(r => !term || r.name.toLowerCase().includes(term)).slice(0, 50);
    list.innerHTML = matches.length
      ? matches.map(r => `<button type="button" class="picker-item" data-id="${r.id}">${escapeHtml(r.name)}<span class="picker-item-owner">${escapeHtml(ownerName(r.owner_id))}</span></button>`).join('')
      : `<div style="padding:14px; color:var(--ink-soft); font-size:13.5px;">Inga träffar.</div>`;
    list.querySelectorAll('.picker-item').forEach(btn => {
      btn.onclick = () => { box.remove(); onSelect(btn.dataset.id); };
    });
  }
  renderList();
  searchInput.addEventListener('input', renderList);
  searchInput.focus();
  box.querySelector('#closePicker').onclick = () => box.remove();
  box.onclick = (e) => { if(e.target === box) box.remove(); };
}

const WEEKDAY_NAMES = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];

function renderWeekPlanGrid(){
  const planError = document.getElementById('planError');
  if(planError) planError.style.display = 'none';
  const weekEnd = addDays(planWeekStart, 6);
  document.getElementById('planRangeLabel').textContent =
    `${planWeekStart.toLocaleDateString('sv-SE', { day:'numeric', month:'short' })} – ${weekEnd.toLocaleDateString('sv-SE', { day:'numeric', month:'short', year:'numeric' })}`;

  grid.innerHTML = '';
  for(let i = 0; i < 7; i++){
    const date = addDays(planWeekStart, i);
    const dateStr = isoDate(date);
    const dayLabel = `${WEEKDAY_NAMES[i]} ${date.getDate()}/${date.getMonth() + 1}`;
    const entry = mealPlan.find(p => p.plan_date === dateStr);
    const recipe = entry ? recipes.find(r => r.id === entry.recipe_id) : null;

    if(recipe){
      grid.appendChild(buildRecipeCard(recipe, {
        dayLabel,
        onRemove: async () => { await clearPlanDay(dateStr); renderGrid(); }
      }));
    }else{
      const card = document.createElement('div');
      card.className = 'card plan-card-empty';
      card.innerHTML = `
        <div class="plan-card-day">${escapeHtml(dayLabel)}</div>
        <button class="btn btn-secondary" type="button">+ Välj recept</button>
      `;
      card.querySelector('button').onclick = () => openRecipePicker(async (recipeId) => {
        await setPlanDay(dateStr, recipeId);
        renderGrid();
      });
      grid.appendChild(card);
    }
  }
}

    b.type = 'button';

  countEl.textContent = planExcludedTags.size || '';

}

      <button id="renameSave" type="button">Spara</button>
      <button id="renameCancel" type="button">Avbryt</button>

    `;
    document.getElementById('renameSave').onclick = async () => {
      const input = document.getElementById('renameInput');
      const newName = input.value.trim();
      const err = document.getElementById('renameError');
      err.style.display = 'none';
      if(!newName){ err.textContent = 'Skriv ett namn.'; err.style.display = ''; return; }
      if(newName === currentUser.name){ renderWhoAmI(false); return; }
      if(allUsers.some(u => u.name === newName && u.id !== currentUser.id)){
        err.textContent = 'Det namnet är redan taget.'; err.style.display = ''; return;
      }
      const { error } = await sb.from('users').update({ name: newName }).eq('id', currentUser.id);
      if(error){ err.textContent = 'Kunde inte spara: ' + error.message; err.style.display = ''; return; }
      currentUser = { ...currentUser, name: newName };
      saveUserToStorage(currentUser);
      allUsers = allUsers.map(u => u.id === currentUser.id ? currentUser : u);
      renderWhoAmI(false);
      renderGrid();
    };
    document.getElementById('renameCancel').onclick = () => renderWhoAmI(false);
    document.getElementById('renameInput').focus();
  }else{
    container.innerHTML = `Du sparar som <strong>${escapeHtml(currentUser.name)}</strong> · <button id="renameUserBtn" type="button">byt namn</button> · <button id="switchUserBtn" type="button">byt receptlåda</button>`;

    document.getElementById('switchUserBtn').onclick = switchUser;
  }
}

function renderTagBar(){
  const tags = allTagsInUse();

    const b = document.createElement('button');

function matchesFilters(r){
  const term = searchTerm.toLowerCase();
  const textOk = !term || r.name.toLowerCase().includes(term) || (r.note || '').toLowerCase().includes(term)
    || (r.ingredients || []).some(ing => ing.toLowerCase().includes(term));
  const tagOk = activeTagFilters.size === 0 || (r.tags||[]).some(t => activeTagFilters.has(t));
  let scopeOk;
  if(viewScope === 'mine') scopeOk = r.owner_id === (currentUser && currentUser.id);
  else if(viewScope === 'favorites') scopeOk = isFavorited(r.id);
  else scopeOk = true;
  return textOk && tagOk && scopeOk;
}

function snippetFor(r){
  if(r.note) return r.note;
  if(r.link) return r.link;
  return 'Inget innehåll utöver bild.';
}

function imagesOf(r){
  if(r.images && r.images.length) return r.images;
  if(r.image) return [r.image];
  return [];
}

function getFilteredSortedList(){
  let list = recipes.filter(matchesFilters);

  // When browsing everyone's recipes, hide copies whose original still exists elsewhere,
  // so a recipe you copied into your own box doesn't show up twice.
  if(viewScope === 'all'){
    const idsPresent = new Set(recipes.map(r => r.id));
    list = list.filter(r => !(r.copied_from && idsPresent.has(r.copied_from)));
  }

  return list.slice().sort((a,b) => {
    if(sortMode === 'alpha') return a.name.localeCompare(b.name, 'sv');
    if(sortMode === 'rating') return ratingStatsFor(b.id).avg - ratingStatsFor(a.id).avg || new Date(b.created_at) - new Date(a.created_at);
    return new Date(b.created_at) - new Date(a.created_at);
  });
}

    ${opts.onRemove ? `<button class="plan-card-remove" type="button" aria-label="Ta bort från veckoplanen">✕</button>` : ''}

    ${imgs[0] ? `<div style="position:relative;"><img class="card-thumb" src="${imgs[0]}" alt="">${imgs.length > 1 ? `<span class="tag-pill" style="position:absolute; bottom:6px; right:6px; background:#2A2620; color:#FBF6E9; border-color:#2A2620;">+${imgs.length - 1}</span>` : ''}</div>` : ''}

    <div class="card-meta">${(r.tags||[]).map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>
    <div class="card-snippet">${escapeHtml(snippetFor(r))}</div>

function setupDropdown(btnId, panelId, { closeOnItemClick } = {}){
  const btn = document.getElementById(btnId);
  const panel = document.getElementById(panelId);
  function close(){
    panel.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  }
  btn.onclick = (e) => {
    e.stopPropagation();
    const isOpen = panel.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(isOpen));
  };
  panel.onclick = (e) => { e.stopPropagation(); };
  if(closeOnItemClick){
    panel.querySelectorAll('.dropdown-item').forEach(item => item.addEventListener('click', close));
  }
  return close;
}

function openLightbox(images, startIdx){
  let idx = startIdx || 0;
  let scale = 1;
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `
    <button class="lightbox-close" aria-label="Stäng">✕</button>
    <div class="lightbox-imgwrap"><img src="${images[idx]}" alt=""></div>
    <div class="lightbox-hint">Nyp för att zooma, eller använd knapparna</div>
    <div class="lightbox-controls">
      ${images.length > 1 ? '<button class="lb-prev" aria-label="Föregående">‹</button>' : ''}
      <button class="lb-out" aria-label="Zooma ut">−</button>
      <button class="lb-reset" aria-label="Återställ">⤢</button>
      <button class="lb-in" aria-label="Zooma in">+</button>
      ${images.length > 1 ? '<button class="lb-next" aria-label="Nästa">›</button>' : ''}
    </div>
  `;
  document.body.appendChild(box);
  const imgEl = box.querySelector('.lightbox-imgwrap img');
  const wrap = box.querySelector('.lightbox-imgwrap');

  function applyScale(){
    imgEl.style.width = (scale * 100) + '%';
  }
  function setImage(){
    imgEl.src = images[idx];
    scale = 1;
    applyScale();
  }
  box.querySelector('.lightbox-close').onclick = () => box.remove();
  box.onclick = (e) => { if(e.target === box) box.remove(); };
  box.querySelector('.lb-in').onclick = () => { scale = Math.min(scale + 0.4, 5); applyScale(); };
  box.querySelector('.lb-out').onclick = () => { scale = Math.max(scale - 0.4, 0.5); applyScale(); };
  box.querySelector('.lb-reset').onclick = () => { scale = 1; applyScale(); wrap.scrollLeft = 0; wrap.scrollTop = 0; };
  imgEl.onclick = () => { scale = scale === 1 ? 2.2 : 1; applyScale(); };
  const prev = box.querySelector('.lb-prev');
  const next = box.querySelector('.lb-next');
  if(prev) prev.onclick = () => { idx = (idx - 1 + images.length) % images.length; setImage(); };
  if(next) next.onclick = () => { idx = (idx + 1) % images.length; setImage(); };
  applyScale();
}

function openTagManager(){
  modalRoot.innerHTML = `
    <div class="overlay" id="ovTags">
      <div class="modal">
        <button class="modal-close" id="closeTags" aria-label="Stäng">✕</button>
        <h2>Hantera taggar</h2>
        <div id="tagList"></div>
        <div id="tagMgrError" style="display:none; color:#A8432B; font-size:13.5px; margin-top:10px; font-weight:600;"></div>
        <div class="addtagrow">
          <input type="text" id="newTagInput" placeholder="Ny tagg…">
          <button class="btn btn-secondary" id="addTagBtn" type="button">Lägg till</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeTags').onclick = async () => { closeModal(); await loadRecipes(); };
  document.getElementById('ovTags').onclick = async (e) => { if(e.target.id === 'ovTags'){ closeModal(); await loadRecipes(); } };

  const tagMgrError = document.getElementById('tagMgrError');
  function showTagError(msg){ tagMgrError.textContent = msg; tagMgrError.style.display = ''; }

  function renderTagList(){
    const list = document.getElementById('tagList');
    list.innerHTML = '';
    allTags.forEach(tag => {
      const row = document.createElement('div');
      row.className = 'tagrow';
      row.innerHTML = `
        <input type="text" value="${escapeHtml(tag.name)}">
        <div class="tagrow-actions">
          <button class="tagrow-save" type="button">Spara</button>
          <button class="tagrow-del" type="button">Ta bort</button>
        </div>
      `;
      const input = row.querySelector('input');
      const delBtn = row.querySelector('.tagrow-del');
      let delArmed = false;

      row.querySelector('.tagrow-save').onclick = async () => {
        const newName = input.value.trim();
        if(!newName || newName === tag.name) return;
        if(!tag.id){ showTagError('Den här taggen kommer från ett recept och behöver köra databas-migreringen först.'); return; }
        const { error } = await sb.from('tags').update({ name: newName }).eq('id', tag.id);
        if(error){ showTagError('Kunde inte byta namn: ' + error.message); return; }
        const affected = recipes.filter(r => (r.tags||[]).includes(tag.name));
        for(const r of affected){
          const newTags = r.tags.map(t => t === tag.name ? newName : t);
          await sb.from('recipes').update({ tags: newTags }).eq('id', r.id);
        }
        await loadRecipes();
        renderTagList();
      };

      delBtn.onclick = async () => {
        if(!delArmed){
          delArmed = true;
          delBtn.textContent = 'Säker?';
          setTimeout(() => { delArmed = false; if(delBtn) delBtn.textContent = 'Ta bort'; }, 3000);
          return;
        }
        delBtn.disabled = true; delBtn.textContent = 'Tar bort…';
        if(tag.id){
          const { error } = await sb.from('tags').delete().eq('id', tag.id);
          if(error){ showTagError('Kunde inte ta bort: ' + error.message); delBtn.disabled = false; delBtn.textContent = 'Ta bort'; return; }
        }
        const affected = recipes.filter(r => (r.tags||[]).includes(tag.name));
        for(const r of affected){
          const newTags = r.tags.filter(t => t !== tag.name);
          await sb.from('recipes').update({ tags: newTags }).eq('id', r.id);
        }
        await loadRecipes();
        renderTagList();
      };

      list.appendChild(row);
    });
  }
  renderTagList();

  document.getElementById('addTagBtn').onclick = async () => {
    const input = document.getElementById('newTagInput');
    const val = input.value.trim();
    if(!val) return;
    if(allTags.some(t => t.name === val)){ showTagError('Den taggen finns redan.'); return; }
    const { data, error } = await sb.from('tags').insert([{ name: val }]).select();
    if(error){ showTagError('Kunde inte lägga till: ' + error.message); return; }
    allTags = allTags.concat(data).sort((a,b) => a.name.localeCompare(b.name,'sv'));
    input.value = '';
    renderTagList();
  };
}

document.getElementById('exportPdfBtn').onclick = async () => {
  const btn = document.getElementById('exportPdfBtn');
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Skapar PDF…';
  try{
    const { jsPDF } = await import('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm');
    const list = getFilteredSortedList();

    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 48;
    const maxWidth = pageWidth - margin * 2;
    let y = margin;

    function ensureSpace(neededHeight){
      if(y + neededHeight > pageHeight - margin){
        doc.addPage();
        y = margin;
      }
    }

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('Receptlådan', margin, y);
    y += 20;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(130);
    const scopeLabel = viewScope === 'mine' ? (currentUser ? currentUser.name + 's recept' : 'Mina recept') : 'Alla recept';
    doc.text(`${scopeLabel} · exporterad ${new Date().toLocaleDateString('sv-SE', {year:'numeric', month:'long', day:'numeric'})} · ${list.length} st`, margin, y);
    y += 14;

    const filterBits = [];
    if(searchTerm.trim()) filterBits.push(`Sökord: "${searchTerm.trim()}"`);
    if(activeTagFilters.size) filterBits.push(`Taggar: ${Array.from(activeTagFilters).join(', ')}`);
    if(filterBits.length){
      doc.setFont('helvetica', 'italic');
      doc.text('Filtrerat på — ' + filterBits.join('  ·  '), margin, y);
      y += 14;
    }
    doc.setTextColor(0);
    y += 14;

    if(list.length === 0){
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(12);
      doc.text('Inga recept matchade det du hade filtrerat på.', margin, y);
    }

    list.forEach((r, idx) => {
      ensureSpace(50);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(15);
      const nameLines = doc.splitTextToSize(r.name, maxWidth);
      ensureSpace(nameLines.length * 18);
      doc.text(nameLines, margin, y);
      y += nameLines.length * 18;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(130);
      const metaBits = [ownerName(r.owner_id) + 's recept'];
      if(r.tags && r.tags.length) metaBits.push(r.tags.join(', '));
      const metaLines = doc.splitTextToSize(metaBits.join('  ·  '), maxWidth);
      ensureSpace(metaLines.length * 12 + 4);
      doc.text(metaLines, margin, y);
      y += metaLines.length * 12 + 6;
      doc.setTextColor(0);

      if(r.link){
        ensureSpace(15);
        doc.setFontSize(10.5);
        doc.setTextColor(30, 90, 160);
        const shownLink = r.link.length > 90 ? r.link.slice(0, 87) + '…' : r.link;
        doc.textWithLink(shownLink, margin, y, { url: r.link });
        doc.setTextColor(0);
        y += 15;
      }

      const imgs = imagesOf(r);
      if(imgs[0] && imgs[0].startsWith('data:image')){
        try{
          const props = doc.getImageProperties(imgs[0]);
          const imgW = Math.min(150, maxWidth);
          const imgH = imgW * (props.height / props.width);
          ensureSpace(imgH + 8);
          doc.addImage(imgs[0], margin, y, imgW, imgH);
          y += imgH + 8;
        }catch(e){ /* skip image that jsPDF can't read */ }
      }

      if(r.note){
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10.5);
        const noteLines = doc.splitTextToSize(r.note, maxWidth);
        noteLines.forEach(line => {
          ensureSpace(14);
          doc.text(line, margin, y);
          y += 14;
        });
      }

      y += 26;
      if(idx < list.length - 1){
        ensureSpace(30);
        doc.setDrawColor(150);
        doc.setLineWidth(1.6);
        doc.line(margin, y, pageWidth - margin, y);
        doc.setLineWidth(0.5);
        doc.setDrawColor(0);
        y += 30;
      }
    });

    doc.save(`receptladan-${new Date().toISOString().slice(0,10)}.pdf`);
    btn.textContent = 'Klart ✓';
  }catch(e){
    console.error(e);
    btn.textContent = 'Kunde inte skapa PDF';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = originalText; }, 2200);
};

async function fetchViaProxy(proxyUrl){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try{
    const res = await fetch(proxyUrl, { signal: controller.signal });
    if(!res.ok) throw new Error('kod ' + res.status);
    return await res.text();
  }catch(e){
    if(e.name === 'AbortError') throw new Error('tog för lång tid (timeout)');
    throw e;
  }finally{
    clearTimeout(timeout);
  }
}

function parseRecipeJsonLd(doc){
  // Many recipe sites embed a schema.org Recipe block (for Google's rich-result
  // snippets) with a real, structured ingredient list — free to read, no guessing.
  const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for(const script of scripts){
    let data;
    try{ data = JSON.parse(script.textContent); }catch(e){ continue; }
    const candidates = Array.isArray(data) ? data : (data['@graph'] || [data]);
    for(const item of candidates){
      if(!item || typeof item !== 'object') continue;
      const type = item['@type'];
      const isRecipe = type === 'Recipe' || (Array.isArray(type) && type.includes('Recipe'));
      if(isRecipe && Array.isArray(item.recipeIngredient) && item.recipeIngredient.length){
        return item.recipeIngredient.map(s => String(s).trim()).filter(Boolean);
      }
    }
  }
  return null;
}

function parseMetaFromHtml(html, baseUrl){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const getMeta = (prop) => {
    const el = doc.querySelector(`meta[property="${prop}"]`) || doc.querySelector(`meta[name="${prop}"]`);
    return el ? el.getAttribute('content') : null;
  };
  let title = getMeta('og:title') || (doc.querySelector('title') ? doc.querySelector('title').textContent : null);
  let image = getMeta('og:image');
  if(image){
    try{ image = new URL(image, baseUrl).href; }catch(e){ /* leave as-is */ }
  }
  const ingredients = parseRecipeJsonLd(doc);
  return { title: title ? title.trim() : null, image, ingredients };
}

function parseIngredientsFromMarkdown(text){
  // Best-effort fallback when there's no schema.org data to read: look for a visible
  // "Ingredienser" heading and grab the list under it from Jina's rendered markdown.
  const lines = text.split('\n');
  const startIdx = lines.findIndex(l => /^#{0,6}\s*ingrediens/i.test(l.trim()));
  if(startIdx === -1) return null;
  const items = [];
  for(let i = startIdx + 1; i < lines.length; i++){
    const line = lines[i].trim();
    if(!line){ if(items.length) break; else continue; }
    if(/^#{1,6}\s/.test(line)) break;
    const m = line.match(/^[-*•]\s+(.+)$/) || line.match(/^\d+[.)]\s+(.+)$/);
    if(m) items.push(m[1].trim());
    else if(items.length) break;
  }
  return items.length ? items : null;
}

function parseMetaFromJinaText(text){
  const m = text.match(/^Title:\s*(.+)$/m);
  const title = m ? m[1].trim() : null;
  const imgMatch = text.match(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/);
  const image = imgMatch ? imgMatch[1] : null;
  const ingredients = parseIngredientsFromMarkdown(text);
  return { title, image, ingredients };
}

async function fetchLinkPreview(url){
  // Browsers block us from fetching other sites' HTML directly (CORS), so we go via
  // free proxy services instead. They come and go (and are sometimes just slow), so we
  // run a few in parallel rather than waiting out a dead/slow one before trying the next.
  const htmlProxies = [
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)
  ];
  const htmlResults = await Promise.allSettled(htmlProxies.map(p => fetchViaProxy(p).then(html => {
    if(!html || html.length <= 50) throw new Error('tomt svar');
    return parseMetaFromHtml(html, url);
  })));
  const htmlInfos = htmlResults
    .filter(r => r.status === 'fulfilled')
    .map(r => r.value)
    .filter(info => info.title || info.image || (info.ingredients && info.ingredients.length));

  // A title/image-only result from a plain HTML fetch doesn't mean we're done: many
  // sites only render their ingredient list via JavaScript, so a result WITH
  // ingredients always wins, and we keep trying (via Jina, which renders the page)
  // until we have ingredients or have genuinely exhausted every source.
  let best = htmlInfos.find(info => info.ingredients && info.ingredients.length) || htmlInfos[0] || null;

  if(!best || !(best.ingredients && best.ingredients.length)){
    try{
      const text = await fetchViaProxy('https://r.jina.ai/' + url);
      if(text && text.length > 50){
        const jinaInfo = parseMetaFromJinaText(text);
        if(!best){
          if(jinaInfo.title || jinaInfo.image || (jinaInfo.ingredients && jinaInfo.ingredients.length)) best = jinaInfo;
        }else if(jinaInfo.ingredients && jinaInfo.ingredients.length){
          best = { ...best, ingredients: jinaInfo.ingredients };
        }
      }
    }catch(e){ /* keep whatever the HTML proxies already found, if anything */ }
  }

  if(!best){
    const firstErr = htmlResults.find(r => r.status === 'rejected');
    throw (firstErr ? firstErr.reason : new Error('Ingen av mellanhands-tjänsterna svarade'));
  }
  return best;
}

function openBackfillIngredients(){

        ${candidates.length === 0
          ? `<p style="color:var(--ink-soft); font-size:14px;">Inga av dina recept behöver kontrolleras just nu — alla med länk har redan antingen ingredienser sparade, eller ingen länk alls.</p>`
          : `<div id="backfillList"></div>
             <div class="modal-actions">
               <span></span>
               <button class="btn btn-primary" id="backfillStart" type="button">Hämta för ${candidates.length} recept</button>
             </div>`
        }
      </div>
    </div>
  `;
  document.getElementById('closeBackfill').onclick = closeModal;
  document.getElementById('ovBackfill').onclick = (e) => { if(e.target.id === 'ovBackfill') closeModal(); };
  if(!candidates.length) return;

  const list = document.getElementById('backfillList');
  list.innerHTML = candidates.map(r => `<div class="plan-day" data-id="${r.id}"><div>${escapeHtml(r.name)}</div><div class="backfill-status" style="font-size:12.5px; color:var(--ink-soft);">Väntar…</div></div>`).join('');

  document.getElementById('backfillStart').onclick = async () => {
    const startBtn = document.getElementById('backfillStart');
    startBtn.disabled = true;
    let found = 0;
    for(const r of candidates){
      const row = list.querySelector(`[data-id="${r.id}"] .backfill-status`);
      startBtn.textContent = `Hämtar… (${candidates.indexOf(r) + 1} av ${candidates.length})`;
      if(row) row.textContent = 'Hämtar…';
      try{
        const info = await fetchLinkPreview(r.link);
        if(info.ingredients && info.ingredients.length){
          // Select the row back after saving, so we report what Postgres actually
          // stored — not just that the request didn't error out.
          const { data: saved, error } = await sb.from('recipes').update({ ingredients: info.ingredients }).eq('id', r.id).select();
          if(error){ if(row) row.textContent = 'Kunde inte spara: ' + error.message; }
          else if(!saved || !saved.length || !(saved[0].ingredients && saved[0].ingredients.length)){
            if(row) row.textContent = 'Sparades inte som väntat — testa gärna igen';
          }else{
            found++; if(row) row.textContent = `✓ Hittade ${saved[0].ingredients.length} ingredienser`;
          }
        }else{
          if(row) row.textContent = 'Hittade ingen ingredienslista på sidan';
        }
      }catch(e){
        if(row) row.textContent = 'Kunde inte hämta sidan (' + (e.message || 'okänt fel') + ')';
      }
      if(candidates.indexOf(r) < candidates.length - 1){
        await new Promise(resolve => setTimeout(resolve, 400)); // liten paus, schonar de gratis proxytjänsterna
      }
    }
    startBtn.textContent = `Klart — hittade ingredienser för ${found} av ${candidates.length}. Klicka för att stänga.`;
    startBtn.disabled = false;
    startBtn.onclick = closeModal;
    await loadRecipes();
  };
}

          const maxDim = 900;
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }

          resolve(canvas.toDataURL('image/jpeg', 0.72));

    formError.style.display = 'none';
    const name = document.getElementById('fName').value.trim();
    if(!name){ formError.textContent = 'Skriv ett receptnamn.'; formError.style.display=''; return; }
    const link = document.getElementById('fLink').value.trim();
    const note = document.getElementById('fText').value.trim();
    const ingredients = document.getElementById('fIngredients').value.split('\n').map(s => s.trim()).filter(Boolean);
    const saveBtn = document.getElementById('saveForm');
    saveBtn.textContent = 'Sparar…'; saveBtn.disabled = true;

    const payload = {
      name,
      link: link || null,
      note: note || null,
      images: imageList,
      tags: Array.from(chosenTags),
      ingredients
    };

    let error;
    if(existing){
      ({ error } = await sb.from('recipes').update(payload).eq('id', existing.id));
    }else{
      ({ error } = await sb.from('recipes').insert([{ ...payload, owner_id: currentUser.id }]));
    }

    if(error){
      formError.textContent = 'Kunde inte spara: ' + error.message;
      formError.style.display = '';
      saveBtn.textContent = 'Spara recept'; saveBtn.disabled = false;
      return;
    }
    closeModal();
    await loadRecipes();
  };
}

boot();
</script>
</body>
</html>
