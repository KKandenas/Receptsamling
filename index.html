};

document.getElementById('exportPdfBtn').onclick = async () => {
  const btn = document.getElementById('exportPdfBtn');
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Skapar PDF…';
  try{
    const { jsPDF } = await import('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm');
    const list = getFilteredSortedList();

    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 48;
    const maxWidth = pageWidth - margin * 2;
    let y = margin;

    function ensureSpace(neededHeight){
      if(y + neededHeight > pageHeight - margin){
        doc.addPage();
        y = margin;
      }
    }

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('Receptlådan', margin, y);
    y += 20;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(130);
    const scopeLabel = viewScope === 'mine' ? (currentUser ? currentUser.name + 's recept' : 'Mina recept') : 'Alla recept';
    doc.text(`${scopeLabel} · exporterad ${new Date().toLocaleDateString('sv-SE', {year:'numeric', month:'long', day:'numeric'})} · ${list.length} st`, margin, y);
    y += 14;

    const filterBits = [];
    if(searchTerm.trim()) filterBits.push(`Sökord: "${searchTerm.trim()}"`);
    if(activeTagFilters.size) filterBits.push(`Taggar: ${Array.from(activeTagFilters).join(', ')}`);
    if(filterBits.length){
      doc.setFont('helvetica', 'italic');
      doc.text('Filtrerat på — ' + filterBits.join('  ·  '), margin, y);
      y += 14;
    }
    doc.setTextColor(0);
    y += 14;

    if(list.length === 0){
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(12);
      doc.text('Inga recept matchade det du hade filtrerat på.', margin, y);
    }

    list.forEach((r, idx) => {
      ensureSpace(50);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(15);
      const nameLines = doc.splitTextToSize(r.name, maxWidth);
      ensureSpace(nameLines.length * 18);
      doc.text(nameLines, margin, y);
      y += nameLines.length * 18;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(130);
      const metaBits = [ownerName(r.owner_id) + 's recept'];
      if(r.tags && r.tags.length) metaBits.push(r.tags.join(', '));
      const metaLines = doc.splitTextToSize(metaBits.join('  ·  '), maxWidth);
      ensureSpace(metaLines.length * 12 + 4);
      doc.text(metaLines, margin, y);
      y += metaLines.length * 12 + 6;
      doc.setTextColor(0);

      if(r.link){
        ensureSpace(15);
        doc.setFontSize(10.5);
        doc.setTextColor(30, 90, 160);
        const shownLink = r.link.length > 90 ? r.link.slice(0, 87) + '…' : r.link;
        doc.textWithLink(shownLink, margin, y, { url: r.link });
        doc.setTextColor(0);
        y += 15;
      }

      const imgs = imagesOf(r);
      const imgFormatMatch = imgs[0] && /^data:image\/(png|jpe?g|webp|gif)/i.exec(imgs[0]);
      if(imgFormatMatch){
        try{
          const imgFormat = ({ png: 'PNG', jpg: 'JPEG', jpeg: 'JPEG', webp: 'WEBP', gif: 'GIF' })[imgFormatMatch[1].toLowerCase()];
          const props = doc.getImageProperties(imgs[0]);
          const imgW = Math.min(150, maxWidth);
          const imgH = imgW * (props.height / props.width);
          ensureSpace(imgH + 8);
          doc.addImage(imgs[0], imgFormat, margin, y, imgW, imgH);
          y += imgH + 8;
        }catch(e){ /* skip image that jsPDF can't read */ }
      }

      if(r.note){
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10.5);
        const noteLines = doc.splitTextToSize(r.note, maxWidth);
        noteLines.forEach(line => {
          ensureSpace(14);
          doc.text(line, margin, y);
          y += 14;
        });
      }

      y += 26;
      if(idx < list.length - 1){
        ensureSpace(30);
        doc.setDrawColor(150);
        doc.setLineWidth(1.6);
        doc.line(margin, y, pageWidth - margin, y);
        doc.setLineWidth(0.5);
        doc.setDrawColor(0);
        y += 30;
      }
    });

    doc.save(`receptladan-${new Date().toISOString().slice(0,10)}.pdf`);
    btn.textContent = 'Klart ✓';
  }catch(e){
    console.error(e);
    btn.textContent = 'Kunde inte skapa PDF';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = originalText; }, 2200);
};

async function fetchViaProxy(proxyUrl){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try{
    const res = await fetch(proxyUrl, { signal: controller.signal });
    if(!res.ok) throw new Error('kod ' + res.status);
    return await res.text();
  }catch(e){
    if(e.name === 'AbortError') throw new Error('tog för lång tid (timeout)');
    throw e;
  }finally{
    clearTimeout(timeout);
  }
}

function parseIsoDurationMinutes(duration){
  if(!duration || typeof duration !== 'string') return null;
  const m = /^P(?:\d+D)?T(?:(\d+)H)?(?:(\d+)M)?/.exec(duration.trim());
  if(!m) return null;
  const total = (m[1] ? parseInt(m[1], 10) : 0) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
  return total > 0 ? total : null;
}

function parseServingsYield(y){
  if(y == null) return null;
  const str = Array.isArray(y) ? y[0] : y;
  const m = /(\d+)/.exec(String(str));
  return m ? parseInt(m[1], 10) : null;
}

function stripHtmlTags(s){
  // Some sites' JSON-LD embeds raw HTML inside a step's text (e.g. a link to
  // another recipe), which would otherwise show up as literal <a href="…"> tags.
  return String(s).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}

function flattenRecipeInstructions(ri){
  if(!ri) return [];
  if(typeof ri === 'string') return ri.split(/\n+/).map(s => s.trim()).filter(Boolean);
  if(!Array.isArray(ri)) return [];
  const steps = [];
  ri.forEach(step => {
    if(typeof step === 'string'){ steps.push(step); return; }
    if(!step || typeof step !== 'object') return;
    if(step['@type'] === 'HowToSection' && Array.isArray(step.itemListElement)){
      step.itemListElement.forEach(s => { if(s && s.text) steps.push(s.text); });
      return;
    }
    if(step.text) steps.push(step.text);
    else if(step.name) steps.push(step.name);
  });
  return steps.map(s => stripHtmlTags(s)).filter(Boolean);
}

function parseRecipeJsonLd(doc){
  // Many recipe sites embed a schema.org Recipe block (for Google's rich-result
  // snippets) with real, structured recipe data — free to read, no guessing.
  const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for(const script of scripts){
    let data;
    try{ data = JSON.parse(script.textContent); }catch(e){ continue; }
    const candidates = Array.isArray(data) ? data : (data['@graph'] || [data]);
    for(const item of candidates){
      if(!item || typeof item !== 'object') continue;
      const type = item['@type'];
      const isRecipe = type === 'Recipe' || (Array.isArray(type) && type.includes('Recipe'));
      if(!isRecipe) continue;
      const ingredients = Array.isArray(item.recipeIngredient) && item.recipeIngredient.length
        ? item.recipeIngredient.map(s => stripHtmlTags(s)).filter(Boolean) : null;
      const instructions = flattenRecipeInstructions(item.recipeInstructions);
      const timeMinutes = parseIsoDurationMinutes(item.totalTime)
        || parseIsoDurationMinutes(item.cookTime)
        || parseIsoDurationMinutes(item.prepTime);
      const servings = parseServingsYield(item.recipeYield);
      if(ingredients || instructions.length || timeMinutes || servings){
        return { ingredients, instructions: instructions.length ? instructions : null, timeMinutes, servings };
      }
    }
  }
  return null;
}

function parseMetaFromHtml(html, baseUrl){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const getMeta = (prop) => {
    const el = doc.querySelector(`meta[property="${prop}"]`) || doc.querySelector(`meta[name="${prop}"]`);
    return el ? el.getAttribute('content') : null;
  };
  let title = getMeta('og:title') || (doc.querySelector('title') ? doc.querySelector('title').textContent : null);
  let image = getMeta('og:image');
  if(image){
    try{ image = new URL(image, baseUrl).href; }catch(e){ /* leave as-is */ }
  }
  const recipeData = parseRecipeJsonLd(doc);
  return {
    title: title ? title.trim() : null, image,
    ingredients: recipeData && recipeData.ingredients,
    instructions: recipeData && recipeData.instructions,
    timeMinutes: recipeData && recipeData.timeMinutes,
    servings: recipeData && recipeData.servings,
  };
}

function stripMarkdownLinks(s){
  // Jina often wraps ingredient/step names in a product link (sometimes with a
  // thumbnail image nested inside it), e.g. "[![alt](imgurl) Namn](https://…)" —
  // strip the markdown link/image syntax, keeping just the visible text. Some
  // sites also render a per-step/-ingredient checkbox, which Jina turns into a
  // leading GFM task-list marker ("[x] " or "[ ] ") — strip that too.
  return s
    .replace(/^-?\s*\[[ xX]\]\s*/, '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

const INGREDIENTS_HEADING_RE = /^#{1,6}\s*ingrediens/i;
const INSTRUCTIONS_HEADING_RE = /^#{1,6}\s*(g[öo]r s[åa] h[äa]r|instruktioner?|tillagning|method|directions|steps)/i;

function parsePlainChecklistItems(lines, startIndex){
  // Last-resort fallback: some sites (e.g. recept.se) render their checklist as a
  // checkbox icon image, then (for steps) a standalone step number, then the actual
  // text — all on separate lines, with no "-"/"1." list marker Jina can preserve.
  // Only treat a line as an item when it directly follows one of those checkbox icon
  // lines, so we don't scoop up unrelated text (byline, photo credit, …) that happens
  // to sit in the same section before the next heading.
  const isImageOnlyLine = l => /^(!\[[^\]]*\]\([^)]*\)\s*)+$/.test(l);
  const items = [];
  for(let i = startIndex; i < lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue;
    if(/^#{1,6}\s/.test(line)) break;
    if(!isImageOnlyLine(line)) continue;
    let j = i + 1;
    while(j < lines.length){
      const next = lines[j].trim();
      if(!next){ j++; continue; }
      if(/^\d+[.)]?$/.test(next)){ j++; continue; } // standalone step number, skip
      if(/^#{1,6}\s/.test(next) || isImageOnlyLine(next)){ i = j - 1; break; }
      items.push(stripMarkdownLinks(next));
      i = j;
      break;
    }
  }
  return items.length ? items : null;
}

function parseIngredientsFromMarkdown(text){
  // Best-effort fallback when there's no schema.org data to read: look for a visible
  // "Ingredienser" heading and grab the list under it from Jina's rendered markdown.
  // Some sites render their ingredient list as an HTML table (name + amount columns),
  // which Jina turns into a markdown table rather than a bullet list, so handle both.
  const lines = text.split('\n');
  const startIdx = lines.findIndex(l => INGREDIENTS_HEADING_RE.test(l.trim()));
  if(startIdx === -1) return null;
  const items = [];
  for(let i = startIdx + 1; i < lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue; // some renderers put a blank line between each list item
    if(/^#{1,6}\s/.test(line)){
      // Some sites split the list with a sub-heading (e.g. "Tillbehör") instead of
      // ending it there — keep going if real list items still follow it, but never
      // past the actual instructions heading (that's a different section entirely,
      // even though its first step may also look like a list item).
      if(INSTRUCTIONS_HEADING_RE.test(line)) break;
      let j = i + 1;
      while(j < lines.length && !lines[j].trim()) j++;
      const next = j < lines.length ? lines[j].trim() : '';
      if(/^\|(.+)\|$/.test(next) || /^[-*•]\s+/.test(next) || /^\d+[.)]\s+/.test(next)) continue;
      break;
    }
    const tableMatch = line.match(/^\|(.+)\|$/);
    if(tableMatch){
      const cells = tableMatch[1].split('|').map(c => stripMarkdownLinks(c)).filter(Boolean);
      const isSeparatorRow = cells.every(c => /^:?-{2,}:?$/.test(c));
      if(!isSeparatorRow && cells.length){
        items.push(cells.length === 2 ? `${cells[1]} ${cells[0]}` : cells.join(' '));
      }
      continue;
    }
    const m = line.match(/^[-*•]\s+(.+)$/) || line.match(/^\d+[.)]\s+(.+)$/);
    if(m) items.push(stripMarkdownLinks(m[1]));
    else if(items.length) break;
  }
  return items.length ? items : parsePlainChecklistItems(lines, startIdx + 1);
}

function parseInstructionsFromMarkdown(text){
  // Mirrors parseIngredientsFromMarkdown, but for the "Gör så här" / "Instruktioner"
  // style heading most recipe sites use for their step list.
  const lines = text.split('\n');
  const startIdx = lines.findIndex(l => INSTRUCTIONS_HEADING_RE.test(l.trim()));
  if(startIdx === -1) return null;
  const items = [];
  for(let i = startIdx + 1; i < lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue; // some renderers put a blank line between each list item
    if(/^#{1,6}\s/.test(line)){
      // Some sites split the steps with a sub-heading (e.g. "Vid servering") instead
      // of ending the list there — keep going if real list items still follow it, but
      // never past an actual ingredients heading (shouldn't normally appear after the
      // instructions, but be defensive the same way as the ingredients parser above).
      if(INGREDIENTS_HEADING_RE.test(line)) break;
      let j = i + 1;
      while(j < lines.length && !lines[j].trim()) j++;
      const next = j < lines.length ? lines[j].trim() : '';
      if(/^[-*•]\s+/.test(next) || /^\d+[.)]\s+/.test(next)) continue;
      break;
    }
    const m = line.match(/^[-*•]\s+(.+)$/) || line.match(/^\d+[.)]\s+(.+)$/);
    if(m) items.push(stripMarkdownLinks(m[1]));
    else if(items.length) break;
  }
  return items.length ? items : parsePlainChecklistItems(lines, startIdx + 1);
}

function parseTimeMinutesFromMarkdown(text){
  // Catches a plainly labeled line like "Tillagningstid: 45 min", "Tillagningstid: 1 tim 30 min"
  // or "Tillagningstid: 1,5 tim" when there's no schema.org data — only matches the explicit
  // Swedish label, never a bare number.
  const m = text.match(/tillagningstid:?\s*([^\n]+)/i);
  if(!m) return null;
  const segment = m[1];
  const h = segment.match(/(\d+(?:[,.]\d+)?)\s*tim/i);
  const mins = segment.match(/(\d+)\s*min/i);
  const total = (h ? parseFloat(h[1].replace(',', '.')) * 60 : 0) + (mins ? parseInt(mins[1], 10) : 0);
  return total > 0 ? Math.round(total) : null;
}

function parseServingsFromMarkdown(text){
  // Catches a standalone line like "4 portioner" — requires the whole line to be just that,
  // to avoid picking up an unrelated number (a rating count, a related recipe's time, etc).
  const m = text.match(/^(\d+)\s*portioner?$/im);
  return m ? parseInt(m[1], 10) : null;
}

function parseMetaFromJinaText(text, pageUrl){
  const m = text.match(/^Title:\s*(.+)$/m);
  const title = m ? m[1].trim() : null;
  // Jina sometimes emits a bogus leading "image" (e.g. the page's own URL, or a
  // nav/UI icon) before the real photo, so scan all of them and prefer the first
  // one that actually looks like a photo and isn't just the page itself.
  const imgUrls = [...text.matchAll(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/g)].map(mm => mm[1]);
  const image = imgUrls.find(u => u !== pageUrl && /\.(jpe?g|png|webp|gif)(\?.*)?$/i.test(u)) || null;
  const ingredients = parseIngredientsFromMarkdown(text);
  const instructions = parseInstructionsFromMarkdown(text);
  const timeMinutes = parseTimeMinutesFromMarkdown(text);
  const servings = parseServingsFromMarkdown(text);
  return { title, image, ingredients, instructions, timeMinutes, servings };
}

async function fetchLinkPreview(url){
  // Browsers block us from fetching other sites' HTML directly (CORS), so we go via
  // free proxy services instead. They come and go (and are sometimes just slow), so we
  // run a few in parallel rather than waiting out a dead/slow one before trying the next.
  const htmlProxies = [
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)
  ];
  const htmlResults = await Promise.allSettled(htmlProxies.map(p => fetchViaProxy(p).then(html => {
    if(!html || html.length <= 50) throw new Error('tomt svar');
    return parseMetaFromHtml(html, url);
  })));
  const htmlInfos = htmlResults
    .filter(r => r.status === 'fulfilled')
    .map(r => r.value)
    .filter(info => info.title || info.image || (info.ingredients && info.ingredients.length) || (info.instructions && info.instructions.length) || info.timeMinutes || info.servings);

  // A title/image-only result from a plain HTML fetch doesn't mean we're done: many
  // sites only render their ingredient list via JavaScript, so a result WITH
  // ingredients always wins, and we keep trying (via Jina, which renders the page)
  // until we have ingredients or have genuinely exhausted every source.
  let best = htmlInfos.find(info => info.ingredients && info.ingredients.length) || htmlInfos[0] || null;

  const hasIngredients = best && best.ingredients && best.ingredients.length;
  const hasInstructions = best && best.instructions && best.instructions.length;
  if(!best || !hasIngredients || !hasInstructions){
    try{
      const text = await fetchViaProxy('https://r.jina.ai/' + url);
      if(text && text.length > 50){
        const jinaInfo = parseMetaFromJinaText(text, url);
        if(!best){
          if(jinaInfo.title || jinaInfo.image || (jinaInfo.ingredients && jinaInfo.ingredients.length) || (jinaInfo.instructions && jinaInfo.instructions.length) || jinaInfo.timeMinutes || jinaInfo.servings) best = jinaInfo;
        }else{
          if(!hasIngredients && jinaInfo.ingredients && jinaInfo.ingredients.length) best = { ...best, ingredients: jinaInfo.ingredients };
          if(!hasInstructions && jinaInfo.instructions && jinaInfo.instructions.length) best = { ...best, instructions: jinaInfo.instructions };
          if(!best.timeMinutes && jinaInfo.timeMinutes) best = { ...best, timeMinutes: jinaInfo.timeMinutes };
          if(!best.servings && jinaInfo.servings) best = { ...best, servings: jinaInfo.servings };
        }
      }
    }catch(e){ /* keep whatever the HTML proxies already found, if anything */ }
  }

  if(!best){
    const firstErr = htmlResults.find(r => r.status === 'rejected');
    throw (firstErr ? firstErr.reason : new Error('Ingen av mellanhands-tjänsterna svarade'));
  }
  return best;
}

function openBackfillIngredients(){
  const candidates = recipes.filter(r =>
    r.owner_id === (currentUser && currentUser.id) && r.link && !(r.ingredients && r.ingredients.length)
  );
  modalRoot.innerHTML = `
    <div class="overlay" id="ovBackfill">
      <div class="modal">
        <button class="modal-close" id="closeBackfill" aria-label="Stäng">✕</button>
        <h2>Hämta ingredienser</h2>
        <p class="explore-intro">Går igenom dina recept som har en länk men saknar en sparad ingredienslista, och försöker hämta in den automatiskt (samma teknik som "Hämta info" när man sparar ett nytt recept). Fungerar bara för sajter som har strukturerad receptdata inbäddad — resten lämnas orörda.</p>
        ${candidates.length === 0
          ? `<p style="color:var(--ink-soft); font-size:14px;">Inga av dina recept behöver kontrolleras just nu — alla med länk har redan antingen ingredienser sparade, eller ingen länk alls.</p>`
          : `<div id="backfillList"></div>
             <div class="modal-actions">
               <span></span>
               <button class="btn btn-primary" id="backfillStart" type="button">Hämta för ${candidates.length} recept</button>
             </div>`
        }
      </div>
    </div>
  `;
  document.getElementById('closeBackfill').onclick = closeModal;
  document.getElementById('ovBackfill').onclick = (e) => { if(e.target.id === 'ovBackfill') closeModal(); };
  if(!candidates.length) return;

  const list = document.getElementById('backfillList');
  list.innerHTML = candidates.map(r => `<div class="plan-day" data-id="${r.id}"><div>${escapeHtml(r.name)}</div><div class="backfill-status" style="font-size:12.5px; color:var(--ink-soft);">Väntar…</div></div>`).join('');

  document.getElementById('backfillStart').onclick = async () => {
    const startBtn = document.getElementById('backfillStart');
    startBtn.disabled = true;
    let found = 0;
    for(const r of candidates){
      const row = list.querySelector(`[data-id="${r.id}"] .backfill-status`);
      startBtn.textContent = `Hämtar… (${candidates.indexOf(r) + 1} av ${candidates.length})`;
      if(row) row.textContent = 'Hämtar…';
      try{
        const info = await fetchLinkPreview(r.link);
        if(info.ingredients && info.ingredients.length){
          // Select the row back after saving, so we report what Postgres actually
          // stored — not just that the request didn't error out.
          const { data: saved, error } = await sb.from('recipes').update({ ingredients: info.ingredients }).eq('id', r.id).select();
          if(error){ if(row) row.textContent = 'Kunde inte spara: ' + error.message; }
          else if(!saved || !saved.length || !(saved[0].ingredients && saved[0].ingredients.length)){
            if(row) row.textContent = 'Sparades inte som väntat — testa gärna igen';
          }else{
            found++; if(row) row.textContent = `✓ Hittade ${saved[0].ingredients.length} ingredienser`;
          }
        }else{
          if(row) row.textContent = 'Hittade ingen ingredienslista på sidan';
        }
      }catch(e){
        if(row) row.textContent = 'Kunde inte hämta sidan (' + (e.message || 'okänt fel') + ')';
      }
      if(candidates.indexOf(r) < candidates.length - 1){
        await new Promise(resolve => setTimeout(resolve, 400)); // liten paus, schonar de gratis proxytjänsterna
      }
    }
    startBtn.textContent = `Klart — hittade ingredienser för ${found} av ${candidates.length}. Klicka för att stänga.`;
    startBtn.disabled = false;
    startBtn.onclick = closeModal;
    await loadRecipes();
  };
}
document.getElementById('backfillBtn').onclick = openBackfillIngredients;

function openForm(id){

  const chosenTags = new Set(existing ? existing.tags : []);
  let imageList = existing ? imagesOf(existing).slice() : [];

  modalRoot.innerHTML = `
    <div class="overlay" id="ovForm">
      <div class="modal">
        <button class="modal-close" id="closeForm" aria-label="Stäng">✕</button>
        <h2>${existing ? 'Redigera recept' : 'Nytt recept'}</h2>
        <div class="field">
          <label for="fName">Receptnamn</label>
          <input type="text" id="fName" value="${existing ? escapeHtml(existing.name) : ''}" placeholder="T.ex. Mammas köttbullar">
        </div>
        <div class="field">
          <label>Taggar</label>
          <div class="chiprow" id="chipRow"></div>
          <div class="customtag">
            <input type="text" id="fCustomTag" placeholder="Lägg till egen tagg…">
            <button class="btn btn-secondary" id="addCustomTag" type="button">Lägg till</button>
          </div>
        </div>
        <div class="field">
          <label for="fLink">Länk (valfritt)</label>
          <div style="display:flex; gap:8px;">
            <input type="url" id="fLink" value="${existing && existing.link ? escapeHtml(existing.link) : ''}" placeholder="https://…" style="flex:1;">
            <button class="btn btn-secondary" id="fetchLinkBtn" type="button" style="white-space:nowrap;">Hämta info</button>
          </div>
          <div id="linkFetchStatus" style="display:none; font-size:12.5px; margin-top:6px;"></div>
        </div>
        <div class="field">
          <label for="fText">Anteckning / receptext (valfritt)</label>
          <textarea id="fText" placeholder="Klistra in eller skriv receptet, eller lägg till en kommentar…">${existing && existing.note ? escapeHtml(existing.note) : ''}</textarea>
        </div>
        <div class="field">
          <label for="fIngredients">Ingredienser (valfritt, en per rad)</label>
          <textarea id="fIngredients" placeholder="T.ex.&#10;400 g kycklingfilé&#10;2 dl grädde&#10;1 gul lök" style="min-height:80px;">${existing && existing.ingredients && existing.ingredients.length ? escapeHtml(existing.ingredients.join('\n')) : ''}</textarea>
        </div>
        <div class="field">
          <label for="fInstructions">Instruktioner (valfritt, ett steg per rad)</label>
          <textarea id="fInstructions" placeholder="T.ex.&#10;Hacka löken fint och fräs den mjuk.&#10;Tillsätt grädde och låt puttra 10 minuter." style="min-height:80px;">${existing && existing.instructions && existing.instructions.length ? escapeHtml(existing.instructions.join('\n')) : ''}</textarea>
        </div>
        <div class="field" style="display:flex; gap:14px;">
          <div style="flex:1;">
            <label for="fTime">Tid, minuter (valfritt)</label>
            <input type="number" id="fTime" min="0" value="${existing && existing.time_minutes ? existing.time_minutes : ''}" placeholder="T.ex. 30">
          </div>
          <div style="flex:1;">
            <label for="fServings">Portioner (valfritt)</label>
            <input type="number" id="fServings" min="0" value="${existing && existing.servings ? existing.servings : ''}" placeholder="T.ex. 4">
          </div>
        </div>
        <div class="field">
          <label>Bilder (valfritt, flera går bra)</label>
          <div class="imgpick">
            <label class="filelabel" for="fImage">Välj bilder</label>
            <input type="file" id="fImage" accept="image/*" multiple style="display:none">
          </div>
          <div class="thumb-row" id="thumbRow"></div>
        </div>
        <div id="formError" style="display:none; color:#A8432B; font-size:13.5px; margin-bottom:10px; font-weight:600;"></div>
        <div class="modal-actions">
          <span></span>
          <div class="right">
            <button class="btn btn-secondary" id="cancelForm" type="button">Avbryt</button>
            <button class="btn btn-primary" id="saveForm" type="button">Spara recept</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const chipRow = document.getElementById('chipRow');
  function renderChips(){
    chipRow.innerHTML = '';
    allTagsInUse().forEach(tag => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip-select' + (chosenTags.has(tag) ? ' active' : '');
      b.textContent = tag;
      b.onclick = () => {
        if(chosenTags.has(tag)) chosenTags.delete(tag); else chosenTags.add(tag);
        renderChips();
      };
      chipRow.appendChild(b);
    });
  }
  renderChips();

  document.getElementById('addCustomTag').onclick = async () => {
    const input = document.getElementById('fCustomTag');
    const val = input.value.trim();
    if(!val) return;
    chosenTags.add(val);
    input.value = '';
    renderChips();
    if(!allTags.some(t => t.name === val)){
      const { data, error } = await sb.from('tags').insert([{ name: val }]).select();
      if(!error && data){
        allTags = allTags.concat(data).sort((a,b) => a.name.localeCompare(b.name,'sv'));
        renderChips();
      }
    }
  };

  const thumbRow = document.getElementById('thumbRow');
  function renderThumbs(){
    thumbRow.innerHTML = '';
    imageList.forEach((src, idx) => {
      const item = document.createElement('div');
      item.className = 'thumb-item';
      item.innerHTML = `<img src="${src}" alt=""><button type="button" class="thumb-remove" aria-label="Ta bort bild">✕</button>`;
      item.querySelector('.thumb-remove').onclick = () => { imageList.splice(idx,1); renderThumbs(); };
      thumbRow.appendChild(item);
    });
  }
  renderThumbs();

  document.getElementById('fetchLinkBtn').onclick = async () => {
    const linkInput = document.getElementById('fLink');
    const status = document.getElementById('linkFetchStatus');
    const fetchBtn = document.getElementById('fetchLinkBtn');
    let url = linkInput.value.trim();
    status.style.display = ''; status.style.color = '#8C8262';
    if(!url){ status.textContent = 'Klistra in en länk först.'; return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    linkInput.value = url;
    fetchBtn.disabled = true; fetchBtn.textContent = 'Hämtar…';
    status.textContent = 'Hämtar information från länken…';
    try{
      const info = await fetchLinkPreview(url);
      const nameInput = document.getElementById('fName');
      const ingredientsInput = document.getElementById('fIngredients');
      const instructionsInput = document.getElementById('fInstructions');
      const timeInput = document.getElementById('fTime');
      const servingsInput = document.getElementById('fServings');
      if(info.title && !nameInput.value.trim()) nameInput.value = info.title;
      if(info.image && !imageList.includes(info.image)){
        imageList.push(info.image);
        renderThumbs();
      }
      if(info.ingredients && info.ingredients.length && !ingredientsInput.value.trim()){
        ingredientsInput.value = info.ingredients.join('\n');
      }
      if(info.instructions && info.instructions.length && !instructionsInput.value.trim()){
        instructionsInput.value = info.instructions.join('\n');
      }
      if(info.timeMinutes && !timeInput.value.trim()) timeInput.value = info.timeMinutes;
      if(info.servings && !servingsInput.value.trim()) servingsInput.value = info.servings;
      const found = [];
      if(info.title) found.push('titel');
      if(info.image) found.push('bild');
      if(info.ingredients && info.ingredients.length) found.push(info.ingredients.length + ' ingredienser');
      if(info.instructions && info.instructions.length) found.push(info.instructions.length + ' instruktionssteg');
      if(info.timeMinutes) found.push('tid');
      if(info.servings) found.push('portioner');
      if(!found.length){
        status.textContent = 'Hittade varken titel, bild eller receptinfo på sidan – fyll i manuellt.';
        status.style.color = '#A8432B';
      }else{
        status.textContent = 'Klart! Fyllde i ' + found.join(', ') + ' — ändra gärna själv.';
        status.style.color = '#4B6B4E';
      }
    }catch(e){
      status.textContent = 'Kunde inte hämta sidan automatiskt (' + (e.message || 'okänt fel') + '). Fyll i manuellt.';
      status.style.color = '#A8432B';
    }
    fetchBtn.disabled = false; fetchBtn.textContent = 'Hämta info';
  };

  function resizeToDataUrl(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 900;
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  const fileInput = document.getElementById('fImage');
  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    for(const file of files){
      try{
        const dataUrl = await resizeToDataUrl(file);
        imageList.push(dataUrl);
        renderThumbs();
      }catch(err){ /* skip file that failed to process */ }
    }
    fileInput.value = '';
  };

  document.getElementById('closeForm').onclick = closeModal;
  document.getElementById('cancelForm').onclick = closeModal;
  document.getElementById('ovForm').onclick = (e) => { if(e.target.id === 'ovForm') closeModal(); };

  document.getElementById('saveForm').onclick = async () => {
    const formError = document.getElementById('formError');
    formError.style.display = 'none';
    const name = document.getElementById('fName').value.trim();
    if(!name){ formError.textContent = 'Skriv ett receptnamn.'; formError.style.display=''; return; }
    const link = document.getElementById('fLink').value.trim();
    const note = document.getElementById('fText').value.trim();
    const ingredients = document.getElementById('fIngredients').value.split('\n').map(s => s.trim()).filter(Boolean);
    const instructions = document.getElementById('fInstructions').value.split('\n').map(s => s.trim()).filter(Boolean);
    const timeVal = document.getElementById('fTime').value.trim();
    const servingsVal = document.getElementById('fServings').value.trim();
    const saveBtn = document.getElementById('saveForm');
    saveBtn.textContent = 'Sparar…'; saveBtn.disabled = true;

    const payload = {
      name,
      link: link || null,
      note: note || null,
      images: imageList,
      tags: Array.from(chosenTags),
      ingredients,
      instructions,
      time_minutes: timeVal ? Number(timeVal) : null,
      servings: servingsVal ? Number(servingsVal) : null
    };

    let error;
    if(existing){
      ({ error } = await sb.from('recipes').update(payload).eq('id', existing.id));
    }else{
      ({ error } = await sb.from('recipes').insert([{ ...payload, owner_id: currentUser.id }]));
    }

    if(error){
      formError.textContent = 'Kunde inte spara: ' + error.message;
      formError.style.display = '';
      saveBtn.textContent = 'Spara recept'; saveBtn.disabled = false;
      return;
    }
    closeModal();
    await loadRecipes();
  };
}

boot();
</script>
</body>
</html>
